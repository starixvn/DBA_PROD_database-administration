version: '3.7'
networks:
  app_network:
    external: ${EXTERNAL_NETWORK}
    name: ${MYSQL_NETWORK}
    driver: ${DRIVER_NETWORK}

services:
  mysql:
    image: mysql:${MYSQL_TAG}
    deploy:
      resources:
        limits:
          memory: 227328M
          #cpus: '32'

    container_name: ${MYSQL_HOST}
    hostname: ${MYSQL_HOST}
    user: ${UID}:${GID}
    cap_add:
      - SYS_NICE  # CAP_SYS_NICE

    volumes:
      - app_volume:/var/lib/mysql:rw
      - ${MYSQL_LOG}:/var/log/mysql:rw
      - ${MYSQL_CONF}/cts_master.cnf:/etc/mysql/conf.d/cts_master.cnf:ro
      - ${MYSQL_TMP}:/var/log/mysql/tmp:rw
      - ${MYSQL_BINLOG}:/var/log/mysql/binlog:rw
      - ${MYSQL_DATA2}/DCS_DataCenter:/var/lib/mysql/DCS_DataCenter:rw
    env_file:
      - ./mysql.env

    ports:
      - '${MYSQL_PORT}:3306'

    networks:
      app_network:
        aliases: 
          - ${MYSQL_HOST}

    restart: always

volumes:
  app_volume:
    external: ${EXTERNAL_VOLUME}
    name: ${DATA_VOLUME}
