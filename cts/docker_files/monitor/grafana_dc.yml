version: '3.7'
name: grafana

networks:
  monitoring:
    external: true
    name: cts_net_monitor
    driver: bridge

services:
  grafana:
    image: grafana/grafana
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    container_name: grafana
    ports:
      - 3000:3000
    networks:
      - monitoring
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasources

  