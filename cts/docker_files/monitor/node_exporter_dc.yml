version: '3.7'
name: node-exporter

networks:
  monitoring:
    external: true
    name: cts_net_monitor
    driver: bridge

services:
  node-exporter:
    image: prom/node-exporter:latest
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - 9100:9100
    networks:
      - monitoring

  