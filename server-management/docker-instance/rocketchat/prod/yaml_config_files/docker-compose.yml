version: '3.7'

# Define networks
networks:
  default:
    name: ${MONGO_NETWORK}
    driver: ${DRIVER_NETWORK}
    external: ${EXTERNAL_NETWORK}

services:
  rocketchat-rs0:
    image: mongo:${MONGO_TAG}
    container_name: ${MONGO_HOST}
    hostname: ${MONGO_HOST}
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - ${MONGO_PORT}:27017
    volumes:
      - ${MONGO_DATA}:/data/db
      - ${MONGO_BACKUP}:/data/backup
      - ${MONGO_LOG}:/var/log/mongodb
      - ${MONGO_CONF}/replica.key:/data/replica.key  # Replica set key file
      - ${MONGO_CONF}/mongod.conf:/etc/mongod.conf  # Mount mongod.conf
    restart: always
    command: "mongod --config /etc/mongod.conf"     # Use mongod.conf
