version: '3.7'
networks:
  network:
    external: ${EXTERNAL_NETWORK}
    name: ${MYSQL_NETWORK}

services:
  mysql:
    image: mysql:${MYSQL_TAG}
    container_name: ${MYSQL_HOST}
    hostname: ${MYSQL_HOST}
    volumes:
      - volume:/var/lib/mysql:rw
      - ${MYSQL_LOG}:/var/log/mysql:rw
      - ${MYSQL_CONF}/mysql.cnf:/etc/mysql/conf.d/mysql.cnf
      - ${MYSQL_INIT}:/docker-entrypoint-initdb.d
    env_file:
      - ./mysql.env
    ports:
     - '${MYSQL_PORT}:3306'
    networks:
      network:
        aliases: 
          - ${MYSQL_HOST}

volumes:
  volume:
    external: ${EXTERNAL_VOLUME}
    name: ${DATA_VOLUME}
